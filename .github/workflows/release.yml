name: Release

on:
  release:
    types: [created]

jobs:
  build-and-upload:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Generate iOS bundles and frameworks
        run: ./Scripts/generate-ios-bundle.sh
      
      - name: Create prebuilds.zip
        run: |
          cd prebuilds/ios
          zip -r ../../prebuilds.zip .
          cd ../..
      
      - name: Upload release asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./prebuilds.zip
          asset_name: prebuilds.zip
          asset_content_type: application/zip
      
      - name: Create framework list
        run: |
          echo "## iOS Frameworks Included" > frameworks.md
          echo "" >> frameworks.md
          ls -1 prebuilds/ios/*.xcframework | sed 's/.*\//- /' >> frameworks.md
          cat frameworks.md
      
      - name: Comment on release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const frameworks = fs.readFileSync('frameworks.md', 'utf8');
            github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: context.payload.release.id,
              body: context.payload.release.body + '\n\n' + frameworks
            });