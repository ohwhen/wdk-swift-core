name: Test

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Setup BareKit framework
        run: ./Scripts/setup-barekit.sh
      
      - name: Generate macOS test bundle
        run: ./Scripts/generate-macos-bundle.sh
      
      - name: Run tests
        run: swift test